<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Entrar al sistema — Molins</title>
<meta name="robots" content="noindex, nofollow" />
<!-- Atajo para que Francisco y Luis no tengan que acordarse la dirección del
     sistema. El CRM NO vive acá: vive en crm.franciscomolins.com, en su propio
     origen, para no compartir cookies con el sitio público.

     El orden de esta cabecera es a propósito y no se reordena:
     1) preconnect abre DNS + TLS con el CRM ANTES de redirigir, así ese costo
        se paga mientras esta página todavía se está leyendo y no después.
     2) el script redirige apenas se parsea, sin esperar a que exista el body.
     3) el meta refresh queda de red por si el JS está apagado.
     Va a la raíz y no a /login a propósito: quien ya entró tiene que caer en
     el sistema, no en el formulario de nuevo. -->
<link rel="preconnect" href="https://crm.franciscomolins.com" crossorigin />
<link rel="dns-prefetch" href="https://crm.franciscomolins.com" />
<script>location.replace("https://crm.franciscomolins.com/");</script>
<meta http-equiv="refresh" content="0; url=https://crm.franciscomolins.com/" />
<style>
  html{background:#14233a;color:#fff;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
  a{color:#fff}
</style>
</head>
<body>
  <p>Llevándote al sistema. Si no arranca solo,
     <a href="https://crm.franciscomolins.com/">entrá desde acá</a>.</p>
</body>
</html>
